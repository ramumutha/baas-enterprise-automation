name: Enterprise Regression Pipeline

on:
  schedule:
    - cron: '0 1 * * *'

  workflow_dispatch:
    inputs:
      target_env:
        description: Target deployment environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - regression
          - preprod
          - prod

jobs:
  regression:
    name: Full Regression (${{ github.event.inputs.target_env || 'qa' }})
    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event.inputs.target_env || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Run framework quality tests
        run: npm run test:framework

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full application regression
        env:
             BANKING_DEMO_BANK_USERNAME: ${{ secrets.BANKING_DEMO_BANK_USERNAME }}
             BANKING_DEMO_BANK_PASSWORD: ${{ secrets.BANKING_DEMO_BANK_PASSWORD }}
             BANKING_REGRESSION_BANK_USERNAME: ${{ secrets.BANKING_REGRESSION_BANK_USERNAME }}
             BANKING_REGRESSION_BANK_PASSWORD: ${{ secrets.BANKING_REGRESSION_BANK_PASSWORD }}
        run: npm run test:ci

      - name: Generate execution summary
        if: always()
        run: npm run report:summary

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence-${{ env.ENV }}
          path: |
            allure-report/
            playwright-report/
            test-results/
            allure-results/
            reports/
          if-no-files-found: ignore
          retention-days: 30