name: Enterprise BaaS Test Automation Pipeline

on:
  schedule:
    - cron: '0 1 * * *' # Nightly Run
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Target Deployment Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - regression
          - preprod
          - prod

jobs:
  test-execution:
    name: Execute Automation Suite (${{ github.event.inputs.target_env || 'qa' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Test Suite
        run: npx playwright test --config=playwright.config.ts
        env:
          ENV: ${{ github.event.inputs.target_env || 'qa' }}

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-execution-report-${{ github.event.inputs.target_env || 'qa' }}
          path: allure-report/
          retention-days: 30