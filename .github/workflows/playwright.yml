name: Playwright Quality Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - regression
          - preprod
          - prod
      suite:
        description: Application suite to execute
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - critical
          - ui
          - api
      client:
        description: Optional client name for matrix-driven runs
        required: false
        default: ''
        type: string

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}
      CLIENT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.client || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Run framework quality tests
        run: npm run test:framework

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run application quality gate
        shell: bash
        env:
          BANKING_DEMO_BANK_USERNAME: ${{ github.event_name == 'workflow_dispatch' && secrets.BANKING_DEMO_BANK_USERNAME || '' }}
          BANKING_DEMO_BANK_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.BANKING_DEMO_BANK_PASSWORD || '' }}
          BANKING_REGRESSION_BANK_USERNAME: ${{ github.event_name == 'workflow_dispatch' && secrets.BANKING_REGRESSION_BANK_USERNAME || '' }}
          BANKING_REGRESSION_BANK_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.BANKING_REGRESSION_BANK_PASSWORD || '' }}
        run: |
          SUITE="${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}"

          case "$SUITE" in
            smoke)
              npx playwright test --grep @smoke
              ;;
            regression)
              npx playwright test --grep @regression
              ;;
            critical)
              npx playwright test --grep @critical
              ;;
            ui)
              npx playwright test --grep @ui
              ;;
            api)
              npx playwright test --grep @api
              ;;
            *)
              echo "Unsupported suite: $SUITE"
              exit 1
              ;;
          esac

      - name: Generate execution summary
        if: always()
        run: npm run report:summary

      - name: Publish execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ env.ENV }}
          path: |
            playwright-report/
            test-results/
            allure-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14